<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - HealthMate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="logo.jpg" alt="Logo" class="logo me-2"> HealthMate
      </a>
      <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
    </div>
  </nav>

  <div class="container my-5">
    <h2 class="mb-3">Welcome, <span id="userName"></span></h2>

    <!-- Tablet Reminder -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-primary text-white">Tablet Reminder</div>
      <div class="card-body">
        <input type="text" id="tabletName" placeholder="Tablet Name" class="form-control mb-2">
        <input type="time" id="tabletTime" class="form-control mb-2">
        <button class="btn btn-primary w-100 mb-2" onclick="setReminder()">Set Reminder</button>
        <ul id="reminderList" class="list-group"></ul>
      </div>
    </div>

    <!-- Doctor Profiles -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header bg-success text-white">Verified Doctors</div>
      <div class="card-body" id="doctorList"></div>
    </div>

    <!-- Appointment Booking -->
    <div class="card shadow-sm">
      <div class="card-header bg-info text-white">Book Appointment</div>
      <div class="card-body">
        <input type="text" id="appointmentDoctor" placeholder="Doctor Name" class="form-control mb-2">
        <input type="date" id="appointmentDate" class="form-control mb-2">
        <button class="btn btn-info w-100" onclick="bookAppointment()">Book</button>
        <ul id="appointmentList" class="list-group mt-2"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
